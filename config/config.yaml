# Succession Planning Tool Configuration

# Backend Configuration
backend:
  default: "snowflake"  # Options: "sqlite", "snowflake"
  available_backends:
    - "sqlite"
    - "snowflake"

# Skills list for dropdowns
skills:
  - "Thinks Strategically"
  - "Plans and Prioritizes"
  - "Ensures Accountability"
  - "Collaborates"
  - "Instills Trust"
  - "Drives Engagement"
  - "Values Differences"
  - "Business Insight"
  - "Courage"
  - "Change Adaptability"

# PLE (Performance Leadership Excellence) list
ple_options:
  - "-- Select an Option --"  # Placeholder for required field
  - "Inspire Individual and Business Success"
  - "Define Strategies, Priorities, and Expectations"
  - "Provide Continuous Coaching and Feedback"
  - "Develop Self and Others and Support Career Aspirations"
  - "Demonstrate Care and Compassion"
  - "Create an Environment Where Disney Values are Experienced"

# Form dropdown options
form_options:
  sourcing_strategy:
    - "Build (Internal hire)"
    - "Redesign: OD Evaluation Needed"
    - "Redesign: OD Evaluation Completed"
    - "External"
  
  role_type:
    - "Not Applicable"
    - "Succession Plan"
    - "Talent Pool"
    - "Redesign"
    - "External"
    - "No Talent backfill required"
  
  scenario_plan:
    - "-- Select an Option --"
    - "Direct Backfill"
    - "Split Position/New Position"
  
  readiness_level:
    - "-- Select an Option --"
    - "Ready Now"
    - "Ready Future"
  
  future_readiness_timing:
    - "-- Select an Option --"
    - "+1 to < 2 years"
    - "+2 to < 3 years"
    - "+3 to < 5 years"

# Database configuration
database:
  # SQLite configuration
  sqlite:
    employee_db: "succession_db.sqlite"
    succession_plans_db: "succession_plans.sqlite"
    
    # Table names
    tables:
      incumbents: "employees"
      successors: "employees"
      succession_plans: "succession_plans"
  
  # Snowflake configuration
  snowflake:
    # Connection parameters (will be set via environment variables or Streamlit secrets)
    account: ""  # Set via st.secrets or env vars
    user: ""     # Set via st.secrets or env vars
    password: "" # Set via st.secrets or env vars
    warehouse: ""
    database: ""
    schema: ""
    
    # Table names (adjust these to match your Snowflake tables)
    tables:
      incumbents: "HR_EXPLORATORY.HR_DE_SANDBOX.SL_VW_SP_TEST"  # Your Snowflake incumbent table name
      successors: "HR_EXPLORATORY.HR_DE_SANDBOX.SL_VW_SP_TEST"  # Your Snowflake successor table name
      succession_plans: "HR_STREAMLIT.SUCCESSION_PLAN.TBL_SL_SUCCESSION_PLAN_DETAIL"
  
  # Search limits (applies to both backends)
  limits:
    incumbent_search: 50
    successor_search: 50

# Database queries
queries:
  # SQLite queries (using table names from config)
  sqlite:
    search_incumbents: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {incumbents_table}
      WHERE LOWER(PREFERRED_LAST_NAME) LIKE LOWER(?)
      LIMIT {search_limit};
    
    search_incumbents_full_name: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {incumbents_table}
      WHERE LOWER(PREFERRED_FIRST_NAME || ' ' || PREFERRED_LAST_NAME) LIKE LOWER(?)
      LIMIT {search_limit};
    
    search_successors: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {successors_table}
      WHERE LOWER(PREFERRED_LAST_NAME) LIKE LOWER(?)
      LIMIT {search_limit};
    
    search_successors_full_name: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {successors_table}
      WHERE LOWER(PREFERRED_FIRST_NAME || ' ' || PREFERRED_LAST_NAME) LIKE LOWER(?)
      LIMIT {search_limit};
    
    get_latest_incumbent_values: |
      SELECT CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
             INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
             NEW_POSITION_TITLE
      FROM {succession_plans_table} 
      WHERE INCUMBENT_EMPLOYEE_ID = ?
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    get_latest_successor_values: |
      SELECT SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
             SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
             SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS
      FROM {succession_plans_table} 
      WHERE SUCCESSOR_EMPLOYEE_ID = ?
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    get_latest_successor_values_for_incumbent: |
      SELECT SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
             SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
             SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS
      FROM {succession_plans_table} 
      WHERE SUCCESSOR_EMPLOYEE_ID = ? AND INCUMBENT_EMPLOYEE_ID = ?
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    save_succession_plan: |
      INSERT INTO {succession_plans_table} (
          INCUMBENT_EMPLOYEE_ID, INCUMBENT_FIRST_NAME, INCUMBENT_LAST_NAME,
          INCUMBENT_EMAIL, INCUMBENT_POSITION, INCUMBENT_MANAGEMENT_LEVEL,
          INCUMBENT_JOB_LEVEL, INCUMBENT_SEGMENT,
          CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
          INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
          NEW_POSITION_TITLE,
          SUCCESSOR_EMPLOYEE_ID, SUCCESSOR_FIRST_NAME, SUCCESSOR_LAST_NAME,
          SUCCESSOR_EMAIL, SUCCESSOR_POSITION, SUCCESSOR_MANAGEMENT_LEVEL,
          SUCCESSOR_JOB_LEVEL, SUCCESSOR_SEGMENT,
          SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
          SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
          SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS,
          REMOVED
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
    
    get_existing_successors_for_incumbent: |
      WITH latest_successors AS (
        SELECT 
          SUCCESSOR_EMPLOYEE_ID,
          MAX(CREATED_AT) as latest_created_at
        FROM {succession_plans_table}
        WHERE INCUMBENT_EMPLOYEE_ID = ?
        GROUP BY SUCCESSOR_EMPLOYEE_ID
      )
      SELECT 
        sp.SUCCESSOR_EMPLOYEE_ID, sp.SUCCESSOR_FIRST_NAME, sp.SUCCESSOR_LAST_NAME,
        sp.SUCCESSOR_EMAIL, sp.SUCCESSOR_POSITION, sp.SUCCESSOR_MANAGEMENT_LEVEL,
        sp.SUCCESSOR_JOB_LEVEL, sp.SUCCESSOR_SEGMENT,
        sp.SUCCESSOR_READINESS, sp.SUCCESSOR_FUTURE_READINESS_TIMING,
        sp.SUCCESSOR_CONTRACT_END_DATE, sp.SUCCESSOR_STRENGTHS, sp.SUCCESSOR_TOP_SKILLS,
        sp.SUCCESSOR_TOP_PLE, sp.SUCCESSOR_DEVELOPMENT_FOCUS, sp.SUCCESSOR_TALENT_ACTIONS,
        sp.REMOVED
      FROM {succession_plans_table} sp
      INNER JOIN latest_successors ls ON sp.SUCCESSOR_EMPLOYEE_ID = ls.SUCCESSOR_EMPLOYEE_ID 
        AND sp.CREATED_AT = ls.latest_created_at
      WHERE sp.INCUMBENT_EMPLOYEE_ID = ? AND sp.REMOVED = FALSE
    
    mark_successor_as_removed: |
      INSERT INTO {succession_plans_table} (
          INCUMBENT_EMPLOYEE_ID, INCUMBENT_FIRST_NAME, INCUMBENT_LAST_NAME,
          INCUMBENT_EMAIL, INCUMBENT_POSITION, INCUMBENT_MANAGEMENT_LEVEL,
          INCUMBENT_JOB_LEVEL, INCUMBENT_SEGMENT,
          CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
          INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
          NEW_POSITION_TITLE,
          SUCCESSOR_EMPLOYEE_ID, SUCCESSOR_FIRST_NAME, SUCCESSOR_LAST_NAME,
          SUCCESSOR_EMAIL, SUCCESSOR_POSITION, SUCCESSOR_MANAGEMENT_LEVEL,
          SUCCESSOR_JOB_LEVEL, SUCCESSOR_SEGMENT,
          SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
          SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
          SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS,
          REMOVED
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, TRUE)

  # Snowflake queries (using string formatting like your working example)
  snowflake:
    search_incumbents: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {incumbents_table}
      WHERE LOWER(PREFERRED_LAST_NAME) LIKE LOWER('{search_term}')
      LIMIT {search_limit}
    
    search_incumbents_full_name: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {incumbents_table}
      WHERE LOWER(CONCAT(PREFERRED_FIRST_NAME, ' ', PREFERRED_LAST_NAME)) LIKE LOWER('{search_term}')
      LIMIT {search_limit}
    
    search_successors: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {successors_table}
      WHERE LOWER(PREFERRED_LAST_NAME) LIKE LOWER('{search_term}')
      LIMIT {search_limit}
    
    search_successors_full_name: |
      SELECT
          SEGMENT_HIER_LEVEL_2_NAME, PREFERRED_FIRST_NAME,
          PREFERRED_LAST_NAME, EMPLOYEE_ID, POSITION_ID,
          POSITION_TITLE, MANAGEMENT_LEVEL, JOB_LEVEL,
          DAYS_IN_MANAGEMENT_LEVEL, LEADER_NAME, HR_SEGMENT
      FROM {successors_table}
      WHERE LOWER(CONCAT(PREFERRED_FIRST_NAME, ' ', PREFERRED_LAST_NAME)) LIKE LOWER('{search_term}')
      LIMIT {search_limit}
    
    get_latest_incumbent_values: |
      SELECT CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
             INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
             NEW_POSITION_TITLE
      FROM {succession_plans_table} 
      WHERE INCUMBENT_EMPLOYEE_ID = '{employee_id}'
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    get_latest_successor_values: |
      SELECT SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
             SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
             SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS
      FROM {succession_plans_table} 
      WHERE SUCCESSOR_EMPLOYEE_ID = '{employee_id}'
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    get_latest_successor_values_for_incumbent: |
      SELECT SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
             SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
             SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS
      FROM {succession_plans_table} 
      WHERE SUCCESSOR_EMPLOYEE_ID = '{successor_employee_id}' AND INCUMBENT_EMPLOYEE_ID = '{incumbent_employee_id}'
      ORDER BY CREATED_AT DESC 
      LIMIT 1
    
    save_succession_plan: |
      INSERT INTO {succession_plans_table} (
          INCUMBENT_EMPLOYEE_ID, INCUMBENT_FIRST_NAME, INCUMBENT_LAST_NAME,
          INCUMBENT_EMAIL, INCUMBENT_POSITION, INCUMBENT_MANAGEMENT_LEVEL,
          INCUMBENT_JOB_LEVEL, INCUMBENT_SEGMENT,
          CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
          INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
          NEW_POSITION_TITLE,
          SUCCESSOR_EMPLOYEE_ID, SUCCESSOR_FIRST_NAME, SUCCESSOR_LAST_NAME,
          SUCCESSOR_EMAIL, SUCCESSOR_POSITION, SUCCESSOR_MANAGEMENT_LEVEL,
          SUCCESSOR_JOB_LEVEL, SUCCESSOR_SEGMENT,
          SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
          SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
          SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS,
          REMOVED
      ) VALUES ('{incumbent_employee_id}', '{incumbent_first_name}', '{incumbent_last_name}',
          '{incumbent_email}', '{incumbent_position}', '{incumbent_management_level}',
          '{incumbent_job_level}', '{incumbent_segment}',
          '{critical_role}', '{responsibilities}', '{incumbent_top_skills}', '{incumbent_top_ple}',
          '{incumbent_contract_end_date}', '{sourcing_strategy}', '{role_type}', '{scenario_plan}',
          '{new_position_title}',
          '{successor_employee_id}', '{successor_first_name}', '{successor_last_name}',
          '{successor_email}', '{successor_position}', '{successor_management_level}',
          '{successor_job_level}', '{successor_segment}',
          '{successor_readiness}', '{successor_future_readiness_timing}',
          '{successor_contract_end_date}', '{successor_strengths}', '{successor_top_skills}',
          '{successor_top_ple}', '{successor_development_focus}', '{successor_talent_actions}',
          FALSE)
    
    get_existing_successors_for_incumbent: |
      WITH latest_successors AS (
        SELECT 
          SUCCESSOR_EMPLOYEE_ID,
          MAX(CREATED_AT) as latest_created_at
        FROM {succession_plans_table}
        WHERE INCUMBENT_EMPLOYEE_ID = '{incumbent_employee_id}'
        GROUP BY SUCCESSOR_EMPLOYEE_ID
      )
      SELECT 
        sp.SUCCESSOR_EMPLOYEE_ID, sp.SUCCESSOR_FIRST_NAME, sp.SUCCESSOR_LAST_NAME,
        sp.SUCCESSOR_EMAIL, sp.SUCCESSOR_POSITION, sp.SUCCESSOR_MANAGEMENT_LEVEL,
        sp.SUCCESSOR_JOB_LEVEL, sp.SUCCESSOR_SEGMENT,
        sp.SUCCESSOR_READINESS, sp.SUCCESSOR_FUTURE_READINESS_TIMING,
        sp.SUCCESSOR_CONTRACT_END_DATE, sp.SUCCESSOR_STRENGTHS, sp.SUCCESSOR_TOP_SKILLS,
        sp.SUCCESSOR_TOP_PLE, sp.SUCCESSOR_DEVELOPMENT_FOCUS, sp.SUCCESSOR_TALENT_ACTIONS,
        sp.REMOVED
      FROM {succession_plans_table} sp
      INNER JOIN latest_successors ls ON sp.SUCCESSOR_EMPLOYEE_ID = ls.SUCCESSOR_EMPLOYEE_ID 
        AND sp.CREATED_AT = ls.latest_created_at
      WHERE sp.INCUMBENT_EMPLOYEE_ID = '{incumbent_employee_id}' AND sp.REMOVED = FALSE
    
    mark_successor_as_removed: |
      INSERT INTO {succession_plans_table} (
          INCUMBENT_EMPLOYEE_ID, INCUMBENT_FIRST_NAME, INCUMBENT_LAST_NAME,
          INCUMBENT_EMAIL, INCUMBENT_POSITION, INCUMBENT_MANAGEMENT_LEVEL,
          INCUMBENT_JOB_LEVEL, INCUMBENT_SEGMENT,
          CRITICAL_ROLE, RESPONSIBILITIES, INCUMBENT_TOP_SKILLS, INCUMBENT_TOP_PLE,
          INCUMBENT_CONTRACT_END_DATE, SOURCING_STRATEGY, ROLE_TYPE, SCENARIO_PLAN,
          NEW_POSITION_TITLE,
          SUCCESSOR_EMPLOYEE_ID, SUCCESSOR_FIRST_NAME, SUCCESSOR_LAST_NAME,
          SUCCESSOR_EMAIL, SUCCESSOR_POSITION, SUCCESSOR_MANAGEMENT_LEVEL,
          SUCCESSOR_JOB_LEVEL, SUCCESSOR_SEGMENT,
          SUCCESSOR_READINESS, SUCCESSOR_FUTURE_READINESS_TIMING,
          SUCCESSOR_CONTRACT_END_DATE, SUCCESSOR_STRENGTHS, SUCCESSOR_TOP_SKILLS,
          SUCCESSOR_TOP_PLE, SUCCESSOR_DEVELOPMENT_FOCUS, SUCCESSOR_TALENT_ACTIONS,
          REMOVED
      ) VALUES ('{incumbent_employee_id}', '{incumbent_first_name}', '{incumbent_last_name}',
          '{incumbent_email}', '{incumbent_position}', '{incumbent_management_level}',
          '{incumbent_job_level}', '{incumbent_segment}',
          '{critical_role}', '{responsibilities}', '{incumbent_top_skills}', '{incumbent_top_ple}',
          '{incumbent_contract_end_date}', '{sourcing_strategy}', '{role_type}', '{scenario_plan}',
          '{new_position_title}',
          '{successor_employee_id}', '{successor_first_name}', '{successor_last_name}',
          '{successor_email}', '{successor_position}', '{successor_management_level}',
          '{successor_job_level}', '{successor_segment}',
          '{successor_readiness}', '{successor_future_readiness_timing}',
          '{successor_contract_end_date}', '{successor_strengths}', '{successor_top_skills}',
          '{successor_top_ple}', '{successor_development_focus}', '{successor_talent_actions}',
          TRUE)

# UI Configuration
ui:
  page_title: "Succession Planning Tool"
  layout: "wide"
  logo_path: "people_insights_logo.png"
  logo_width: 100

# Avatar/Photo configuration
avatar:
  base_url: "https://rostr.disney.com/api/v2/people/{employee_id}/avatars/thumbnail_large"
  token: "abc4fc58f30914f6d99faa8a31f4d44c"
  default_width: 50
  # Full URL template
  url_template: "https://rostr.disney.com/api/v2/people/{employee_id}/avatars/thumbnail_large?locale=en&token=abc4fc58f30914f6d99faa8a31f4d44c"

# PowerPoint configuration
powerpoint:
  template_file: "succession_profile_template.pptx"
  successors_per_slide: 3
  slide_width: 10.0  # inches
  slide_height: 7.5  # inches
  font_family: "Calibri"
  title_font_size: 18
  content_font_size: 12
  max_text_length: 80
  
  # Auto-repair settings
  auto_repair: true
  repair_method: "standard"  # Options: "standard", "temp_file", "deep_clean"

# Form validation rules
validation:
  min_search_length: 2
  max_search_results: 50
  max_skills_selection: 3

# Search configuration
search:
  default_type: "last_name"  # Options: "last_name", "full_name"
  available_types:
    - name: "last_name"
      display_name: "Last Name"
      description: "Search by last name only"
      placeholder: "Enter last name..."
    - name: "full_name"
      display_name: "Full Name"
      description: "Search by first and last name"
      placeholder: "Enter full name (e.g., John Smith)..."
